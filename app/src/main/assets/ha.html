<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
<title>Home Assistant — Type-G Smart</title>
<style>
  :root{--bg:#0b121c;--card:#14212e;--line:#283a4c;--mint:#66edb4;--fg:#eaf0f7;--muted:#a0b2c7;--field:#0e1926}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,'Segoe UI',Tahoma,sans-serif;padding:20px;max-width:560px;margin:auto}
  h1{font-size:20px;margin:8px 0 4px}
  p.muted{color:var(--muted);margin:0 0 18px;font-size:14px;line-height:1.7}
  label{display:block;margin:14px 0 6px;font-size:14px;color:var(--muted)}
  input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);font-size:15px}
  .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  button{flex:1;min-width:120px;padding:13px;border-radius:12px;border:0;font-size:15px;font-weight:600;cursor:pointer}
  .primary{background:var(--mint);color:#09291d}
  .quiet{background:var(--card);color:var(--fg);border:1px solid var(--line)}
  .status{margin-top:16px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;min-height:20px}
  .ok{color:var(--mint)} .bad{color:#ff8a9c}
  code{background:var(--field);padding:2px 6px;border-radius:6px}
  ol{color:var(--muted);font-size:13px;line-height:1.9;padding-inline-start:20px}
</style></head>
<body>
  <h1>ربط Home Assistant</h1>
  <p class="muted">التطبيق هيتحكم في سويتشات Home Assistant ويعرضها جنب مشتركاتك. محتاج عنوان HA وتوكن وصول دائم.</p>

  <label>عنوان Home Assistant</label>
  <input id="url" inputmode="url" placeholder="http://192.168.1.50:8123" dir="ltr">

  <label>Long-Lived Access Token</label>
  <input id="token" placeholder="الصق التوكن هنا" dir="ltr">

  <div class="row">
    <button class="primary" id="save">حفظ وفحص</button>
    <button class="quiet" id="back">رجوع</button>
  </div>
  <div class="status" id="status"></div>

  <ol>
    <li>افتح HA في المتصفح، ادخل على بروفايلك (تحت الشمال).</li>
    <li>انزل لـ <code>Long-Lived Access Tokens</code> واضغط <code>Create Token</code>.</li>
    <li>انسخه والصقه هنا (مش هيظهر تاني في HA).</li>
  </ol>

<script>
function call(action,obj){try{return JSON.parse(window.TypeG.call(action,JSON.stringify(obj||{})))}catch(e){return{error:String(e)}}}
var st=document.getElementById('status');
var cur=call('haStatus');
if(cur&&cur.url){document.getElementById('url').value=cur.url;}
if(cur&&cur.configured){st.innerHTML=cur.connected?'<span class="ok">مفعّل ومتصل ✓</span>':'<span class="bad">محفوظ بس مش متصل — راجع العنوان/التوكن أو إن HA شغّال</span>';}
document.getElementById('save').onclick=function(){
  var url=document.getElementById('url').value.trim();
  var token=document.getElementById('token').value.trim();
  if(!url){st.textContent='اكتب عنوان HA';return;}
  call('haSave',{url:url,token:token});
  st.textContent='بيفحص…';
  setTimeout(function(){
    var r=call('haStatus');
    st.innerHTML=(r&&r.connected)?'<span class="ok">تم الحفظ والاتصال نجح ✓ — ارجع هتلاقي سويتشات HA ظهرت</span>'
      :'<span class="bad">اتحفظ بس الاتصال فشل — تأكد إن HA شغّال والعنوان والتوكن صح</span>';
  },1200);
};
document.getElementById('back').onclick=function(){location.href='index.html';};
</script>
</body></html>

plugins { id 'com.android.application' }

// رقم البناء من GitHub Actions — كل نسخة لها رقم فريد وتزايدي تلقائيًا
def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
def baseName = "1.3.0"

android {
    namespace 'com.typegsmart.aio'
    compileSdk 35

    defaultConfig {
        applicationId "com.typegsmart.aio"
        minSdk 26
        targetSdk 35
        versionCode 100 + runNo
        versionName runNo > 0 ? "${baseName}.${runNo}" : "${baseName}-dev"
    }
    buildFeatures { buildConfig true }

    signingConfigs {
        shared {
            storeFile file('signing.jks')
            storePassword 'typegsmart'
            keyAlias 'typeg'
            keyPassword 'typegsmart'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.shared   // مفتاح ثابت => التحديثات تتثبّت فوق القديمة
        }
        release {
            minifyEnabled false        // الكود مش متصغّر عشان يفضل مقروء للتطوير
            signingConfig signingConfigs.shared
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// حل تعارض Kotlin stdlib: نسخة واحدة + استبعاد النسخ المنفصلة القديمة (دمجت في 1.8+)
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}

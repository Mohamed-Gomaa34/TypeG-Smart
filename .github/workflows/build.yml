name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log

      - name: Surface build errors as annotations
        if: failure()
        run: |
          echo "===== compile errors ====="
          grep -nE "error:|\\.java:[0-9]+:|^\\* What went wrong:|> Task .*FAILED|Caused by:" /tmp/build.log | head -25 > /tmp/err.txt || true
          echo "----- context after 'What went wrong' -----"
          awk '/\* What went wrong:/{f=1} f{print; n++} n>12{exit}' /tmp/build.log >> /tmp/err.txt || true
          while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-480)
            [ -n "$clean" ] && echo "::error::${clean}"
          done < /tmp/err.txt

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TypeG-Smart.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TypeG-Smart-debug-apk
          path: dist/TypeG-Smart.apk
          if-no-files-found: error

      - name: Publish APK to Releases (one direct link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Type-G Smart v1.3.0.${{ github.run_number }}
          body: "النسخة 1.3.0.${{ github.run_number }} — اضغط TypeG-Smart.apk تحت للتحميل المباشر."
          files: dist/TypeG-Smart.apk
